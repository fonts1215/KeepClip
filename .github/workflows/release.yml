name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag esistente da pubblicare (es. v0.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    name: GitVersion
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - name: Restore pinned GitVersion tool
        run: dotnet tool restore
      - name: Calculate version once for all architectures
        id: version
        run: |
          $version = ./scripts/Get-Version.ps1 -OutputPath ./artifacts/version/KeepClip.version.json
          "semver=$($version.SemVer)" >> $env:GITHUB_OUTPUT
          "Release tag: ${env:RELEASE_TAG}, version: $($version.SemVer), MSIX: $($version.AssemblySemFileVer), commit: $($version.Sha)" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v6
        with:
          name: KeepClip-version
          path: artifacts/version/KeepClip.version.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Packages (${{ matrix.architecture }})
    needs: version
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64, x86]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore app with locked dependencies
        run: dotnet restore src/KeepClip.App/KeepClip.App.csproj -p:Platform=${{ matrix.architecture }} --locked-mode
      - name: Download shared version metadata
        uses: actions/download-artifact@v6
        with:
          name: KeepClip-version
          path: artifacts/version
      - name: Publish self-contained app
        run: ./scripts/Publish-App.ps1 -Architecture ${{ matrix.architecture }} -NoRestore -PublishDirectory ./artifacts/publish-${{ matrix.architecture }} -VersionFile ./artifacts/version/KeepClip.version.json
      - name: Prepare separate MSIX payload
        run: |
          New-Item -ItemType Directory -Path artifacts/msix-${{ matrix.architecture }} -Force | Out-Null
          Copy-Item -Path artifacts/publish-${{ matrix.architecture }}/* -Destination artifacts/msix-${{ matrix.architecture }} -Recurse
      - name: Build and verify portable ZIP
        run: ./scripts/Build-Portable.ps1 -SkipBuild -Architecture ${{ matrix.architecture }} -PublishDirectory ./artifacts/publish-${{ matrix.architecture }} -OutputDirectory ./artifacts/packages
      - name: Build unsigned MSIX
        run: ./scripts/Build-Package.ps1 -SkipBuild -Architecture ${{ matrix.architecture }} -PublishDirectory ./artifacts/msix-${{ matrix.architecture }} -OutputDirectory ./artifacts/packages
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: release-packages-${{ matrix.architecture }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.msix
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect packages for every architecture
        uses: actions/download-artifact@v6
        with:
          pattern: release-packages-*
          path: release
          merge-multiple: true
      - name: Generate combined checksums
        run: |
          cd release
          sha256sum *.zip *.msix | sort -k2 > SHA256SUMS.txt
          echo "### Pacchetti della release" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          KeepClip ${{ needs.version.outputs.semver }} per Windows (x64 · ARM64 · x86).

          Ogni architettura ha due pacchetti. I checksum sono in `SHA256SUMS.txt`.

          ### ZIP portabile (consigliato)
          `KeepClip-<versione>-windows-<arch>.zip` — nessuna installazione: estrai
          completamente lo ZIP in una cartella stabile e avvia `KeepClip.exe`,
          mantenendo insieme tutti i file estratti (includono .NET e Windows App
          Runtime). Se l'app non compare, esegui `Avvia-con-diagnostica.cmd`.

          ### MSIX (non firmato)
          `KeepClip-<versione>-windows-<arch>.msix` — **non è firmato**, quindi non
          è installabile con un doppio clic. Per installarlo occorre un certificato
          attendibile: firma il pacchetto e fidati del certificato sul dispositivo,
          oppure usa lo ZIP portabile se vuoi solo provare l'app.
          EOF
        shell: bash
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ contains(env.RELEASE_TAG, '-') }}
        run: |
          prerelease_flag=""
          if [ "$IS_PRERELEASE" = "true" ]; then prerelease_flag="--prerelease"; fi
          gh release create "$RELEASE_TAG" \
            release/*.zip release/*.msix release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "KeepClip ${{ needs.version.outputs.semver }}" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease_flag
        shell: bash
